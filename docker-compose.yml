version: '3.9'

services:
  db:
    image: mysql:8.0
    container_name: mediflow-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mediflow
      MYSQL_USER: mediflow
      MYSQL_PASSWORD: mediflow
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mediflow-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_ENV: development
      HOST: 0.0.0.0
      PORT: 5000
      SQLALCHEMY_DATABASE_URI: mysql+pymysql://mediflow:mediflow@db:3306/mediflow
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mediflow-frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
    restart: unless-stopped

volumes:
  mysql_data:
